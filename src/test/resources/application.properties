# 所有 SpringBootTest 默认使用隔离 test profile；不读取开发者本机密钥文件。
spring.profiles.active=test

# 主配置引用该文件，即使测试禁用 MCP 连接也不会因 classpath 资源不存在而失败。
spring.ai.mcp.client.stdio.servers-configuration=classpath:mcp-servers.json

# R01：OIDC 测试 profile 使用的 client secret 夹具。
# OidcClientSecretResolver 只从环境变量读取（secret://oidc/client-secret →
# VIO_OIDC_SECRET_OIDC_CLIENT_SECRET），因此这里用测试属性提供同名键。
# 这是本地夹具，不是真实凭据；生产必须由 Secret Store 注入。
VIO_OIDC_SECRET_OIDC_CLIENT_SECRET=oidc-login-test-client-secret
