# ============================================================
# 📋 本地开发环境配置模板
# ============================================================
# 使用方法：
#   1. 复制此文件为 application-local.yml
#      cp application-local.example.yml application-local.yml
#   2. DeepSeek 用户启用 local,deepseek 并设置 DEEPSEEK_API_KEY；无需填写百炼 Key
#      可选搜索另设 SEARCH_API_KEY。不要将真实 Key 写回此模板。
#   3. application-local.yml 已在 .gitignore 中，不会被提交
# ============================================================
# 本地开发环境配置（spring.profiles.active: local）
# 覆盖 application.yml 中的默认配置
# 禁用本地不可用的外部服务：MCP Server、PGVector
# ============================================================
spring:
  autoconfigure:
    exclude:
      # 本地无 PostgreSQL，排除 PGVector 自动配置
      - org.springframework.ai.autoconfigure.vectorstore.pgvector.PgVectorStoreAutoConfiguration
      # 排除 DataSource 自动配置（无数据库）
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration
  ai:
    dashscope:
      # 替换为你的阿里云百炼 API Key
      api-key: your-dashscope-api-key-here
    mcp:
      client:
        # 本地开发时 MCP Server 未启动，禁用 MCP 客户端
        # 需要 MCP 功能时改为 true 并先启动 MCP Server
        enabled: false

# 替换为你的 SearchAPI Key（用于联网搜索工具）
search-api:
  api-key: ${SEARCH_API_KEY:}

# 浏览器跨域白名单（只填写完整 origin，不要使用 '*' 或带路径的 URL）
vio:
  agent:
    specialists:
      # 三类角色复用当前ChatModel；改为true后重启后端。
      enabled: ${VIO_AGENT_SPECIALISTS_ENABLED:false}
  local-accounts:
    # 本机用户名/密码登录；如启用企业 OIDC，必须先关闭此开关。
    enabled: ${VIO_LOCAL_ACCOUNTS_ENABLED:true}
    path: ${VIO_LOCAL_ACCOUNTS_PATH:${user.dir}/.local-data/accounts.sqlite}
  local-history:
    enabled: true
    path: ${VIO_LOCAL_HISTORY_PATH:${user.dir}/.local-data/history.sqlite}
  run:
    # 本地模板默认不做事件物理清理；需要演练时使用独立 fixture/数据库并显式开启。
    event-retention-cleanup-enabled: false
    event-retention-cleanup-interval-ms: 3600000
    event-retention-cleanup-batch-size: 1000
    # 模型调用缓存默认关闭；本地不要使用明文/伪加密 codec。
    model-cache:
      enabled: false
      fail-closed: true
      step-no: 1
      ttl-seconds: 3600
      model-version: ''
      prompt-version: v1.1
  rag:
    legacy-memory:
      # 默认 fail-closed；仅在离线演示明确接受 degraded 空库时改为 true。
      enabled: false
    embedding-model: dashscope-text-embedding-v3
    embedding-dimensions: 1536
    ingestion:
      staging-root: ${user.dir}/staging
  http:
    cors:
      allowed-origins:
        - http://localhost:3000
        - http://127.0.0.1:3000
  security:
    # 本地不连接 Redis；如需本地验证请单独启动脱敏 Redis 并显式切换，
    # 生产 profile 才允许 backend=redis 自动装配。
    oidc:
      # 本地默认关闭；启用时只填测试 IdP 的非 Secret 元数据。
      enabled: false
      required: false
      issuer-uri: https://id.example.test/realms/vio
      jwks-uri: https://id.example.test/realms/vio/protocol/openid-connect/certs
      authorization-uri: https://id.example.test/realms/vio/protocol/openid-connect/auth
      token-uri: https://id.example.test/realms/vio/protocol/openid-connect/token
      audience: vio-api
      client-id: vio-web
      client-secret-ref: secret://oidc/client-secret
      redirect-uris:
        - http://localhost:3000/auth/callback
      scopes: [openid, profile]
      allowed-algorithms: [RS256]
      require-pkce: true
      cookie-secure: false
      cookie-same-site: Lax
      policy:
        # 本地启用 OIDC 时也必须显式提供脱敏 tenant/role/tool 映射；空映射拒绝工具。
        enabled: true
        required: true
        require-tenant: true
        tenant-claim: tenant_id
        policy-version: v1
        binding-ttl-seconds: 300
        max-requests-per-minute: 60
        principal-tenants: {}
        tenant-roles: {}
        role-tools: {}
    global-quota-enabled: false
    global-quota-backend: memory
  tools:
    resource-download:
      # 高危工具默认关闭；若在本地显式打开，仅写入此隔离目录并受配额限制。
      directory: ${VIO_RESOURCE_DOWNLOAD_DIR:${user.dir}/tmp/download}
      max-bytes: ${VIO_RESOURCE_DOWNLOAD_MAX_BYTES:20971520}
      max-total-bytes: ${VIO_RESOURCE_DOWNLOAD_MAX_TOTAL_BYTES:104857600}
      allowed-media-types: ${VIO_RESOURCE_DOWNLOAD_ALLOWED_MEDIA_TYPES:image/,application/pdf,application/json,text/plain}

logging:
  level:
    org.springframework.ai: INFO
    com.vio.vioaiagent: DEBUG

# Embedding攻略检索默认关闭。配置完整endpoint/model/key后显式构建索引；
# 使用 VIO_GUIDE_SEMANTIC_ENABLED、VIO_GUIDE_EMBEDDING_ENDPOINT、
# VIO_GUIDE_EMBEDDING_API_KEY、VIO_GUIDE_EMBEDDING_MODEL、
# VIO_GUIDE_EMBEDDING_DIMENSIONS 环境变量，勿把真实Key提交到本文件。
# 本地小语料存SQLite；独立的生产pgvector表仍须遵守其1536维迁移约束。
