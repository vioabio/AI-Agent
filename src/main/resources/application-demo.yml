# ============================================================
# 演示 / 隔离验收 Profile（--spring.profiles.active=demo）
# ============================================================
# 定位：受控、隔离、单人/小团队的**非生产**演示环境。
#
# 为什么需要它（升级方案 F01）
# ---------------------------
# application-prod.yml 默认 OIDC_ENABLED=false 且 OIDC_REQUIRED=true，
# 这是有意的 fail-closed：防止把共享 API Key 的身份模式误当成生产部署。
# 但 docker-compose.yml 原先直接使用 prod，且没有注入任何 OIDC 变量，
# 于是按文档启动必然在 Bean 初始化阶段直接失败。
#
# 正确做法不是把 required 全局改成 false（那会让生产也能用共享 Key 上线），
# 而是把"演示"显式建模为独立、**自包含**的装配：保持 prod 的硬约束，
# 只放开身份模式与游标签名密钥两处。
#
# 为什么是自包含而不是"继承 prod"（S0/B01 三轮实测结论）
# -----------------------------------------------------
# 曾尝试让 demo 复用 application-prod.yml，三种机制都不给出可控的覆盖顺序：
#   1) group 写在 application-prod.yml：单独激活 demo 时 active profiles 只有
#      [demo]，group 完全不生效（Spring 只在激活阶段读非 profile 专属文档的 group）。
#   2) group 移到 application.yml：能激活 prod，但属性优先级实测为
#      [application-prod.yml, application-demo.yml, ...]，prod 压在 demo 之上，
#      oidc.required 仍是 true；把声明顺序改成 demo,prod 也无效。
#   3) spring.config.import: classpath:application-prod.yml：实测被导入文档
#      同样排在导入者**之上**，覆盖方向与预期相反。
# 三种机制下 demo 的放开都会静默失效。因此改为自包含装配：覆盖关系不再依赖
# Spring 的文档排序，而是本文件内的直白赋值。
#
# 代价是"共享键要和 prod 保持一致"。这一点不靠人眼维护：
# DemoProdParityTest 会逐键比较演示与生产共用配置的期望值，漂移即红灯。
#
# 禁止事项
# --------
# - 不得用于正式生产发布（生产必须 VIO_OIDC_ENABLED=true 接入真实 OIDC）。
# - 不得把 VIO_API_KEY 当作多用户身份：共享 Key 会被所有浏览器复用为同一主体。
# - 不要在此文件写入真实密钥；密钥一律由环境/Secret Store 注入。

spring:
  # 与 prod 一致：只排除 PGVector 自动配置，**打开** DataSource/JdbcTemplate/Flyway。
  # application.yml 默认排除了 JDBC 相关自动配置；若不清空这里的 exclude，
  # 演示环境会静默回落到 @Profile("!prod") 的内存仓储，重启即丢数据且不报错。
  # 这是 B01 真正的危害所在，也是本文件必须显式声明的原因。
  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.vectorstore.pgvector.PgVectorStoreAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME:vio}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
  data:
    redis:
      host: ${VIO_REDIS_HOST:__unset__}
      port: ${VIO_REDIS_PORT:6379}
      username: ${VIO_REDIS_USERNAME:}
      password: ${VIO_REDIS_PASSWORD:}
      connect-timeout: ${VIO_REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${VIO_REDIS_TIMEOUT:2s}
      ssl:
        enabled: ${VIO_REDIS_SSL_ENABLED:false}
  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY}
    mcp:
      client:
        enabled: ${VIO_MCP_ENABLED:false}
        sse:
          connections: {}
        stdio:
          servers-configuration: ${VIO_MCP_SERVERS_CONFIGURATION:classpath:/mcp-servers.prod.json}

management:
  endpoint:
    health:
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
      probes:
        enabled: true

search-api:
  api-key: ${SEARCH_API_KEY}

# 生产环境日志级别
logging:
  level:
    org.springframework.ai: INFO
    com.vio.vioaiagent: INFO

vio:
  http:
    cors:
      # 与 prod 一致：必须显式配置，未配置时启动失败而不是退回通配符。
      allowed-origins: ${VIO_CORS_ALLOWED_ORIGINS}
  agent:
    v1:
      enabled: ${VIO_AGENT_V1_ENABLED}
  # 演示保留旧 /ai/** 兼容链，便于对比新旧入口行为；
  # 生产由 prod 的 false 关闭并返回 410 提示迁移。
  legacy:
    ai:
      enabled: ${VIO_LEGACY_AI_ENABLED:true}
    manus:
      enabled: ${VIO_LEGACY_MANUS_ENABLED:false}
  rag:
    pgvector:
      enabled: ${VIO_RAG_PGVECTOR_ENABLED}
    legacy-memory:
      enabled: ${VIO_RAG_LEGACY_MEMORY_ENABLED:false}
    embedding-model: ${VIO_RAG_EMBEDDING_MODEL:dashscope-text-embedding-v3}
    embedding-dimensions: ${VIO_RAG_EMBEDDING_DIMENSIONS:1536}
    ingestion:
      staging-root: ${VIO_RAG_INGESTION_STAGING_ROOT:${user.dir}/staging}
      worker-enabled: ${VIO_RAG_INGESTION_WORKER_ENABLED:false}
      worker-poll-ms: ${VIO_RAG_INGESTION_WORKER_POLL_MS:1000}
      worker-batch-size: ${VIO_RAG_INGESTION_WORKER_BATCH_SIZE:1}
      outbox-batch-size: ${VIO_RAG_INGESTION_OUTBOX_BATCH_SIZE:50}
  pokemon:
    activity:
      max-freshness-days: ${VIO_ACTIVITY_MAX_FRESHNESS_DAYS:7}
      fixture:
        enabled: false
  mcp:
    enabled: ${VIO_MCP_ENABLED:false}
  tools:
    high-risk:
      enabled: ${VIO_HIGH_RISK_TOOLS_ENABLED:false}
    resource-download:
      directory: ${VIO_RESOURCE_DOWNLOAD_DIR:${user.dir}/tmp/download}
      max-bytes: ${VIO_RESOURCE_DOWNLOAD_MAX_BYTES:20971520}
      max-total-bytes: ${VIO_RESOURCE_DOWNLOAD_MAX_TOTAL_BYTES:104857600}
      allowed-media-types: ${VIO_RESOURCE_DOWNLOAD_ALLOWED_MEDIA_TYPES:image/,application/pdf,application/json,text/plain}
  security:
    enabled: true
    trusted-proxy-cidrs: ${VIO_TRUSTED_PROXY_CIDRS:}
    oidc:
      # 演示使用 API Key 过渡身份。enabled 与 required 必须**成对**为 false：
      # enabled=false + required=true 会被 OidcProperties 判定为配置冲突并阻止启动，
      # 这正是 F01 报告的启动阻断。
      enabled: ${VIO_OIDC_ENABLED:false}
      required: ${VIO_OIDC_REQUIRED:false}
      # 演示环境即便启用 OIDC 也允许非 HTTPS 回调与不安全 cookie，仅供本地联调；
      # 生产由 prod 的 HTTPS/Secure 校验强制（见 DemoProdParityTest 的差异白名单）。
      cookie-secure: ${VIO_OIDC_COOKIE_SECURE:false}
      issuer-uri: ${VIO_OIDC_ISSUER_URI:}
      jwks-uri: ${VIO_OIDC_JWKS_URI:}
      authorization-uri: ${VIO_OIDC_AUTHORIZATION_URI:}
      token-uri: ${VIO_OIDC_TOKEN_URI:}
      audience: ${VIO_OIDC_AUDIENCE:}
      client-id: ${VIO_OIDC_CLIENT_ID:}
      client-secret-ref: ${VIO_OIDC_CLIENT_SECRET_REF:}
      redirect-uris: ${VIO_OIDC_REDIRECT_URIS:}
      scopes: [openid, profile]
      allowed-algorithms: [RS256]
      require-pkce: ${VIO_OIDC_REQUIRE_PKCE:true}
      session-idle-timeout-seconds: ${VIO_OIDC_SESSION_IDLE_TIMEOUT_SECONDS:1800}
      session-absolute-timeout-seconds: ${VIO_OIDC_SESSION_ABSOLUTE_TIMEOUT_SECONDS:28800}
      cookie-same-site: ${VIO_OIDC_COOKIE_SAME_SITE:Lax}
      cookie-name: ${VIO_OIDC_COOKIE_NAME:VIO_SESSION}
      subject-claim: ${VIO_OIDC_SUBJECT_CLAIM:sub}
      role-claim: ${VIO_OIDC_ROLE_CLAIM:roles}
      clock-skew-seconds: ${VIO_OIDC_CLOCK_SKEW_SECONDS:60}
      policy:
        enabled: ${VIO_OIDC_POLICY_ENABLED:true}
        required: ${VIO_OIDC_POLICY_REQUIRED:true}
        require-tenant: ${VIO_OIDC_POLICY_REQUIRE_TENANT:true}
        tenant-claim: ${VIO_OIDC_TENANT_CLAIM:tenant_id}
        policy-version: ${VIO_OIDC_POLICY_VERSION:v1}
        binding-ttl-seconds: ${VIO_OIDC_POLICY_BINDING_TTL_SECONDS:300}
        max-requests-per-minute: ${VIO_OIDC_POLICY_MAX_REQUESTS_PER_MINUTE:60}
        principal-tenants: {}
        tenant-roles: {}
        role-tools: {}
    global-quota-enabled: ${VIO_GLOBAL_QUOTA_ENABLED:false}
    global-quota-backend: ${VIO_GLOBAL_QUOTA_BACKEND:jdbc}
    bootstrap-api-key: ${VIO_API_KEY}
    allowed-paths:
      - ${user.dir}/tmp
    blocked-commands: []
  resource:
    cursor:
      # 与 prod 一致：不提供默认值。演示环境也必须由环境变量显式注入，
      # 缺失时由 StartupContractValidator 给出字段级错误（demo 用空默认值，
      # 属性可解析，因此确实由校验器报错，而不是占位符解析异常）。
      secret: ${VIO_RESOURCE_CURSOR_SECRET:}
      ttl-seconds: ${VIO_RESOURCE_CURSOR_TTL_SECONDS:900}
  run:
    durable-resume: ${VIO_RUN_DURABLE_RESUME:false}
    event-broker-enabled: ${VIO_EVENT_BROKER_ENABLED:false}
    outbox-poll-ms: ${VIO_OUTBOX_POLL_MS:1000}
    lease-ttl-seconds: ${VIO_RUN_LEASE_TTL_SECONDS:30}
    heartbeat-seconds: ${VIO_RUN_HEARTBEAT_SECONDS:10}
    event-retention-days: ${VIO_EVENT_RETENTION_DAYS:30}
    event-retention-cleanup-enabled: ${VIO_EVENT_RETENTION_CLEANUP_ENABLED:false}
    event-retention-cleanup-interval-ms: ${VIO_EVENT_RETENTION_CLEANUP_INTERVAL_MS:3600000}
    event-retention-cleanup-batch-size: ${VIO_EVENT_RETENTION_CLEANUP_BATCH_SIZE:1000}
    model-cache:
      enabled: ${VIO_MODEL_INVOCATION_CACHE_ENABLED:false}
      fail-closed: ${VIO_MODEL_INVOCATION_CACHE_FAIL_CLOSED:true}
      step-no: ${VIO_MODEL_INVOCATION_CACHE_STEP_NO:1}
      ttl-seconds: ${VIO_MODEL_INVOCATION_CACHE_TTL_SECONDS:3600}
      model-version: ${VIO_MODEL_VERSION:}
      prompt-version: ${VIO_PROMPT_VERSION:v1.1}
  orchestration:
    session-state:
      enabled: true
    max-concurrent-agents: 10
    agent-timeout-minutes: 10
    max-retries: 3
  memory:
    enabled: ${VIO_MEMORY_ENABLED:false}
    short-term-max-tokens: 4000
    recall-top-k: 5
    encryption-key: ${VIO_MEMORY_ENCRYPTION_KEY:}
    key-version: ${VIO_MEMORY_KEY_VERSION:v1}
    default-ttl-days: ${VIO_MEMORY_DEFAULT_TTL_DAYS:30}
  feedback:
    enabled: ${VIO_FEEDBACK_ENABLED:true}
    require-lineage: ${VIO_FEEDBACK_REQUIRE_LINEAGE:true}
    operator-roles:
      "${VIO_FEEDBACK_OPERATOR_ID}":
        - ${VIO_FEEDBACK_OPERATOR_ROLE:operator}
