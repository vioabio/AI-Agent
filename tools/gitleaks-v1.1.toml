# v1.1 working-tree/build-context scan only.
# This allowlist is deliberately limited to the approved local secret-store
# paths; do not reuse it for `gitleaks git --full-history` or image scans.
[extend]
useDefault = true

[allowlist]
description = "approved local secret-store paths only"
paths = [
  '''(^|/)src/main/resources/application-local\.yml$''',
  '''(^|/)src/main/resources/application-local\.yaml$''',
  '''(^|/)src/main/resources/application-local\.properties$''',
  '''(^|/)src/main/resources/mcp-servers\.json$'''
]
