title = "VIO AI Agent gitleaks policy"

[extend]
useDefault = true

# 测试/模板令牌没有访问权限，保留用于安全单测和文档示例。
# 真实密钥仍会被默认规则拦截；不要把本地 application-local.yml 加入仓库。
[allowlist]
description = "documented placeholders and test-only token"
paths = [
  '''(^|/)(\.env\.example|.*\.example\.(yml|yaml|json)|evaluation/datasets/.*\.jsonl)$''',
  '''(^|/)document/.*$'''
]
regexes = [
  '''sk-local-dev-001''',
  '''your-[a-z0-9-]+-here''',
  '''replace-with-[a-z0-9-]+'''
]

# Runtime component attestations contain class SHA-256 values, including "Api" in this class name.
# Match both the archive location and this exact metadata shape, retaining the default key rule.
[[rules]]
id = "generic-api-key"
  [[rules.allowlists]]
  description = "U6 LocalPokeApiRepository class SHA-256 metadata"
  condition = "AND"
  paths = ['''^evaluation/upgrade-v1\.1/u6/.*\.json$''']
  regexTarget = "match"
  regexes = ['''^LocalPokeApiRepository"\s*:\s*"[a-f0-9]{64}"$''']
