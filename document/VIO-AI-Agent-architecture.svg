  <path d="M1147 414 L1147 488 L1040 488 L1040 525" class="main-line"/>
  <path d="M1270 414 L1270 475 L1435 475 L1435 525" class="optional-line"/>

  <!-- 数据与外部依赖层 -->
  <rect x="36" y="680" width="1528" height="195" rx="18" class="band"/>
  <rect x="50" y="694" width="138" height="28" rx="14" fill="#ffedd5"/>
  <text x="119" y="713" text-anchor="middle" class="layer">数据与外部依赖</text>

  <rect x="65" y="737" width="335" height="105" rx="14" class="external"/>
  <text x="232" y="765" text-anchor="middle" class="node-title">文档知识库 / 向量存储</text>
  <text x="232" y="790" text-anchor="middle" class="node-text">classpath:document/*.md → 切分 / 关键词 / Embedding</text>
  <text x="232" y="814" text-anchor="middle" class="small">实线：SimpleVectorStore（内存）</text>
  <text x="232" y="833" text-anchor="middle" class="tiny">PGVector / PostgreSQL：已声明，当前 prod 未接入</text>

  <rect x="435" y="737" width="335" height="105" rx="14" class="external"/>
  <text x="602" y="765" text-anchor="middle" class="node-title">阿里云 DashScope</text>
  <text x="602" y="792" text-anchor="middle" class="node-text">Qwen Chat + Embedding API</text>
  <text x="602" y="816" text-anchor="middle" class="small">模型推理、查询重写、向量化、关键词增强</text>

  <rect x="805" y="737" width="335" height="105" rx="14" class="external"/>
  <text x="972" y="765" text-anchor="middle" class="node-title">本地与网络资源</text>
  <text x="972" y="792" text-anchor="middle" class="node-text">文件系统 / SearchAPI / 网页 / 终端</text>
  <text x="972" y="816" text-anchor="middle" class="small">下载资源 / 生成 PDF</text>

  <rect x="1175" y="737" width="355" height="105" rx="14" class="external"/>
  <text x="1352" y="765" text-anchor="middle" class="node-title">独立图片 MCP Server</text>
  <text x="1352" y="792" text-anchor="middle" class="node-text">vio-image-search-mcp-server → Pexels API</text>
  <text x="1352" y="816" text-anchor="middle" class="small">当前不在 Compose；prod 默认 MCP_ENABLED=false</text>

  <path d="M232 630 L232 737" class="main-line"/>
  <path d="M602 630 L602 737" class="main-line"/>
  <path d="M972 630 L972 737" class="main-line"/>
  <path d="M1352 630 L1352 737" class="optional-line"/>

  <!-- 平台扩展层 -->
  <rect x="36" y="895" width="1528" height="190" rx="18" class="band"/>
  <rect x="50" y="909" width="110" height="28" rx="14" fill="#e2e8f0"/>
  <text x="105" y="928" text-anchor="middle" class="layer">平台扩展层</text>
  <rect x="65" y="951" width="1465" height="104" rx="14" class="optional"/>
  <text x="797" y="975" text-anchor="middle" class="node-title">源码已有，但当前主 API 请求链未直接接入或尚未闭环</text>
  <line x1="430" y1="988" x2="430" y2="1044" stroke="#cbd5e1"/>
  <line x1="795" y1="988" x2="795" y2="1044" stroke="#cbd5e1"/>
  <line x1="1160" y1="988" x2="1160" y2="1044" stroke="#cbd5e1"/>
  <text x="247" y="1007" text-anchor="middle" class="node-text">Plan-and-Execute 多智能体</text>
  <text x="247" y="1030" text-anchor="middle" class="small">Planner → DAG Workers → Reviewer</text>
  <text x="612" y="1007" text-anchor="middle" class="node-text">三层 TieredMemory</text>
  <text x="612" y="1030" text-anchor="middle" class="small">Working / Short / Long（未注入 VioManus）</text>
  <text x="977" y="1007" text-anchor="middle" class="node-text">自建 MCP / JSON-RPC 协议栈</text>
  <text x="977" y="1030" text-anchor="middle" class="small">Gateway / Session / STDIO / SSE（独立路线）</text>
  <text x="1342" y="1007" text-anchor="middle" class="node-text">企业化治理辅助模块</text>
  <text x="1342" y="1030" text-anchor="middle" class="small">HITL / Guard / Audit / Retry / Metrics</text>
  <path d="M1505 182 L1540 182 L1540 1003 L1530 1003" class="optional-line"/>

  <!-- 部署与运维层 -->
  <rect x="36" y="1105" width="1528" height="128" rx="18" class="band"/>
  <rect x="50" y="1119" width="110" height="28" rx="14" fill="#ccfbf1"/>
  <text x="105" y="1138" text-anchor="middle" class="layer">部署与运维</text>
  <rect x="175" y="1145" width="1265" height="66" rx="14" class="ops"/>
  <text x="807" y="1172" text-anchor="middle" class="node-title">Docker Compose：Frontend :80 · Backend :8123 · PostgreSQL :5432</text>
  <text x="807" y="1196" text-anchor="middle" class="node-text">monitoring profile：Prometheus / Grafana / Alertmanager（当前配置与指标链路尚未闭环）</text>

  <text x="800" y="1260" text-anchor="middle" class="tiny">依据：当前工作区源码、配置、前端 API 与 Docker Compose 的静态接线核对；未把 README 概念能力直接当作已运行能力</text>
</svg>
