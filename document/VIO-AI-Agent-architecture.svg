<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1280" viewBox="0 0 1600 1280">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrowOptional" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9ca3af"/>
    </marker>
    <style>
      .title { font: 700 27px 'Microsoft YaHei','Noto Sans SC',sans-serif; fill:#111827; }
      .subtitle { font: 14px 'Microsoft YaHei','Noto Sans SC',sans-serif; fill:#64748b; }
      .layer { font: 700 14px 'Microsoft YaHei','Noto Sans SC',sans-serif; fill:#334155; letter-spacing:1px; }
      .node-title { font: 700 17px 'Microsoft YaHei','Noto Sans SC',sans-serif; fill:#172033; }
      .node-text { font: 13px 'Microsoft YaHei','Noto Sans SC',sans-serif; fill:#475569; }
      .small { font: 12px 'Microsoft YaHei','Noto Sans SC',sans-serif; fill:#64748b; }
      .tiny { font: 11px 'Microsoft YaHei','Noto Sans SC',sans-serif; fill:#64748b; }
      .white { fill:#ffffff; }
      .main-line { fill:none; stroke:#64748b; stroke-width:2.2; marker-end:url(#arrow); }
      .optional-line { fill:none; stroke:#9ca3af; stroke-width:1.8; stroke-dasharray:8 6; marker-end:url(#arrowOptional); }
      .band { fill:#f8fafc; stroke:#e2e8f0; stroke-width:1; }
      .access { fill:#eaf2ff; stroke:#4a7fd4; stroke-width:1.7; }
      .app { fill:#eaf8f0; stroke:#2e8b57; stroke-width:1.8; }
      .core { fill:#f1ecfa; stroke:#7b5ea7; stroke-width:1.7; }
      .external { fill:#fff8e6; stroke:#e07b00; stroke-width:1.7; }
      .optional { fill:#f8fafc; stroke:#94a3b8; stroke-width:1.6; stroke-dasharray:8 6; }
      .ops { fill:#e8f7f7; stroke:#238c8c; stroke-width:1.7; }
      .chip { fill:#ffffff; stroke:#b8c7dc; stroke-width:1; }
    </style>
  </defs>

  <rect width="1600" height="1280" fill="#ffffff"/>
  <text x="800" y="42" text-anchor="middle" class="title">VIO AI Agent 项目架构图（基于当前源码接线）</text>
  <text x="800" y="68" text-anchor="middle" class="subtitle">实线表示当前主请求链；虚线表示按配置启用、半接入或尚未进入主链的能力</text>

  <!-- 图例 -->
  <g transform="translate(1165,18)">
    <line x1="0" y1="15" x2="52" y2="15" class="main-line"/>
    <text x="65" y="20" class="small">当前主链</text>
    <line x1="0" y1="43" x2="52" y2="43" class="optional-line"/>
    <text x="65" y="48" class="small">可选 / 未闭环</text>
  </g>

  <!-- 接入层 -->
  <rect x="36" y="92" width="1528" height="132" rx="18" class="band"/>
  <rect x="50" y="106" width="88" height="28" rx="14" fill="#dbeafe"/>
  <text x="94" y="125" text-anchor="middle" class="layer">接入层</text>

  <!-- 用户 Actor -->
  <circle cx="105" cy="151" r="15" fill="none" stroke="#334155" stroke-width="2"/>
  <line x1="105" y1="166" x2="105" y2="193" stroke="#334155" stroke-width="2"/>
  <line x1="82" y1="177" x2="128" y2="177" stroke="#334155" stroke-width="2"/>
  <line x1="105" y1="193" x2="88" y2="213" stroke="#334155" stroke-width="2"/>
  <line x1="105" y1="193" x2="122" y2="213" stroke="#334155" stroke-width="2"/>
  <text x="105" y="220" text-anchor="middle" class="tiny">用户</text>

  <rect x="205" y="116" width="440" height="92" rx="14" class="access" filter="url(#shadow)"/>
  <text x="425" y="143" text-anchor="middle" class="node-title">Vue 3 + Vite SPA / Nginx</text>
  <text x="425" y="167" text-anchor="middle" class="node-text">/game-master → GameApp SSE</text>
  <text x="425" y="188" text-anchor="middle" class="node-text">/super-agent → VioManus SSE / stop</text>

  <rect x="745" y="106" width="760" height="108" rx="14" class="access" filter="url(#shadow)"/>
  <text x="1125" y="133" text-anchor="middle" class="node-title">Spring Boot 3.5.16 / Java 21 · :8123 · context-path /api</text>
  <rect x="790" y="151" width="200" height="36" rx="18" class="chip"/>
  <text x="890" y="174" text-anchor="middle" class="small">ObservabilityFilter</text>
  <rect x="1025" y="151" width="200" height="36" rx="18" class="chip"/>
  <text x="1125" y="174" text-anchor="middle" class="small">API Key（需运行验证）</text>
  <rect x="1260" y="151" width="200" height="36" rx="18" class="chip"/>
  <text x="1360" y="174" text-anchor="middle" class="small">AiController</text>
  <path d="M138 174 L205 174" class="main-line"/>
  <path d="M645 162 L745 162" class="main-line"/>

  <!-- 应用层 -->
  <rect x="36" y="244" width="1528" height="205" rx="18" class="band"/>
  <rect x="50" y="258" width="88" height="28" rx="14" fill="#dcfce7"/>
  <text x="94" y="277" text-anchor="middle" class="layer">应用层</text>

  <rect x="165" y="292" width="575" height="122" rx="16" class="app" filter="url(#shadow)"/>
  <text x="452" y="321" text-anchor="middle" class="node-title">GameApp · 宝可梦垂直智能问答</text>
  <text x="452" y="349" text-anchor="middle" class="node-text">基础对话 / RAG / 本地工具 / MCP 四种模式</text>
  <text x="452" y="372" text-anchor="middle" class="node-text">同步 + Flux / SseEmitter · 20 条内存会话窗口</text>
  <text x="452" y="395" text-anchor="middle" class="small">当前前端：/api/ai/game_app/chat/sse_emitter</text>

  <rect x="860" y="292" width="575" height="122" rx="16" class="app" filter="url(#shadow)"/>
  <text x="1147" y="321" text-anchor="middle" class="node-title">VioManus · ReAct 工具智能体</text>
  <text x="1147" y="349" text-anchor="middle" class="node-text">BaseAgent → ReActAgent → ToolCallAgent → VioManus</text>
  <text x="1147" y="372" text-anchor="middle" class="node-text">模型选工具 → 执行 → 观察 → 下一轮（最多 20 步）</text>
  <text x="1147" y="395" text-anchor="middle" class="small">每请求新实例 · SSE 分步输出 · session stop / 并发守卫</text>

  <path d="M1360 187 L1360 236 L452 236 L452 292" class="main-line"/>
  <path d="M1360 187 L1360 292 L1147 292" class="main-line"/>

  <!-- 核心能力层 -->
  <rect x="36" y="469" width="1528" height="191" rx="18" class="band"/>
  <rect x="50" y="483" width="110" height="28" rx="14" fill="#ede9fe"/>
  <text x="105" y="502" text-anchor="middle" class="layer">核心能力层</text>

  <rect x="65" y="525" width="335" height="105" rx="14" class="core"/>
  <text x="232" y="553" text-anchor="middle" class="node-title">RAG 知识增强</text>
  <text x="232" y="579" text-anchor="middle" class="node-text">QueryRewriter + QuestionAnswerAdvisor</text>
  <text x="232" y="602" text-anchor="middle" class="small">当前：GameAppVectorStoreConfig</text>

  <rect x="435" y="525" width="335" height="105" rx="14" class="core"/>
  <text x="602" y="553" text-anchor="middle" class="node-title">Spring AI 运行时</text>
  <text x="602" y="579" text-anchor="middle" class="node-text">ChatClient / Advisor / ToolCallingManager</text>
  <text x="602" y="602" text-anchor="middle" class="small">主模型：DashScope qwen-plus</text>

  <rect x="805" y="525" width="335" height="105" rx="14" class="core"/>
  <text x="972" y="553" text-anchor="middle" class="node-title">8 类本地 ToolCallback</text>
  <text x="972" y="579" text-anchor="middle" class="node-text">File / Search / Scrape / Download / Terminal</text>
  <text x="972" y="602" text-anchor="middle" class="small">PDF / PokeType / Terminate</text>

  <rect x="1175" y="525" width="355" height="105" rx="14" class="core"/>
  <text x="1352" y="553" text-anchor="middle" class="node-title">Spring AI MCP Client</text>
  <text x="1352" y="579" text-anchor="middle" class="node-text">ToolCallbackProvider 合并远程工具</text>
  <text x="1352" y="602" text-anchor="middle" class="small">SSE :8127 / STDIO · 按配置启用</text>

  <path d="M330 414 L330 487 L232 487 L232 525" class="main-line"/>
  <path d="M452 414 L452 476 L602 476 L602 525" class="main-line"/>
