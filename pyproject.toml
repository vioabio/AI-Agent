[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liepin-talent-rpa"
version = "0.1.0"
description = "Android device diagnostics and project bootstrap for Liepin talent automation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic-settings>=2.14,<3.0",
  "pymysql>=1.2,<2.0",
  "pyyaml>=6.0,<7.0",
  "uiautomator2>=3.7,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider --basetemp=work/pytest-temp"

[tool.setuptools.packages.find]
where = ["src"]
