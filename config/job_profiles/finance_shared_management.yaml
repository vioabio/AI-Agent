experience:
  related_years_min: 8
  shared_or_group_management_years_min: 3
selection:
  relevant_score_min: 80
  review_score_min: 65
  score_breakdown_limits:
    industry_depth: 35
    beauty_continuity: 25
    role_evidence: 40
search_pack_scheduling: "interleaved"
search_packs:
  - id: "finance_shared"
    label: "财务共享与管理经理"
    include_unbranded: true
    terms:
      - "财务共享中心负责人"
      - "财务共享中心经理"
      - "财务共享负责人"
      - "财务共享运营经理"
      - "SSC负责人"
      - "SSC经理"
      - "财务共享项目经理"
      - "共享中心运营经理"
      - "财务共享中心总监"
      - "企业财务共享 流程迁移"
      - "财务共享 标准化 SOP"
      - "财务共享 月结关账"
      - "财务共享 总账核算"
      - "财务共享 自动凭证"
      - "财务共享 RPA"
      - "财务共享 BI 数据质量"
    brands: []
  - id: "group_accounting"
    label: "财务共享与管理经理"
    include_unbranded: true
    terms:
      - "集团核算负责人"
      - "集团核算经理"
      - "多法人财务经理"
      - "多主体核算经理"
      - "集团关账经理"
      - "集团总账经理"
      - "民营集团 多主体核算"
      - "民营集团 多法人管理"
      - "连锁企业 多门店财务"
