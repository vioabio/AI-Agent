id: "finance_shared_management_v1"
title: "财务共享与管理经理"
source_jd_title: "财务共享与管理经理"
coze_workflow_key: "finance"
analysis_prompt_path: "config/prompts/finance_shared_management_v3.txt"
required_job_intent_city: "上海"
education: "统招本科及以上，财务、会计、审计等相关专业"
education_requirement:
  minimum_degree: "本科"
  require_unified_admission: true
age:
