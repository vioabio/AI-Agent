server {
    listen 127.0.0.1:18443 ssl;
    server_name localhost 127.0.0.1;
    ssl_certificate /opt/ai-recruitment/shared/tls/localhost.crt;
    ssl_certificate_key /opt/ai-recruitment/shared/tls/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/ai-recruitment/current/web/hr-review/dist;
    index index.html;
    client_max_body_size 1m;
    access_log off;
    error_log /var/log/nginx/ai-recruitment-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_hide_header Server;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~ /\. {
        deny all;
    }
}
