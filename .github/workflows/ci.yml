name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # 仅用于 Compose 冒烟；不是真实凭据，也不会写入镜像或日志。
      DB_PASSWORD: ci-only-db-password
      VIO_API_KEY: ci-only-vio-token
      VIO_CORS_ALLOWED_ORIGINS: http://localhost:3000
      AI_DASHSCOPE_API_KEY: ci-only-dashscope-key
      SEARCH_API_KEY: ci-only-search-key
      VIO_FEEDBACK_OPERATOR_ID: ci-operator
      VIO_FEEDBACK_OPERATOR_ROLE: operator
      VIO_FEEDBACK_ENABLED: "true"
      VIO_MEMORY_ENABLED: "false"
      GRAFANA_ADMIN_PASSWORD: ci-only-grafana-password
      VIO_AGENT_V1_ENABLED: "false"
      VIO_RAG_PGVECTOR_ENABLED: "false"
      VIO_MCP_ENABLED: "false"
      MCP_ENABLED: "false"
      # F01：资源游标签名密钥不再有默认值，compose 启动前必须显式提供，
      # 否则 StartupContractValidator 会按设计拒绝启动。
      VIO_RESOURCE_CURSOR_SECRET: ci-only-cursor-secret
      # F01：compose 使用 demo profile（prod 的受限演示覆盖层）。
      # prod 默认 OIDC_REQUIRED=true，未接入真实 OIDC 时会 fail-closed 拒绝启动。
      SPRING_PROFILES_ACTIVE: demo
      # R01：OIDC 在本 CI 中保持关闭，故此处只提供夹具占位。
      # 若将来在 CI 打开 VIO_OIDC_ENABLED，client secret 引用将按
      # secret://<name> → VIO_OIDC_SECRET_<NAME 大写> 解析，缺项会拒绝启动。
      VIO_OIDC_SECRET_OIDC_CLIENT_SECRET: ci-only-oidc-client-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vio-ai-agent-frontend/package-lock.json

      - name: Backend compile
        run: ./mvnw -B -ntp -DskipTests compile

      - name: Backend tests
        run: ./mvnw -B -ntp test

      # F14：真实 PostgreSQL 集成测试此前从未被执行——pom 声明了 Testcontainers，
      # 但没有任何 *IT 用例，且 Failsafe 只能发现 *IT/IT*/*ITCase 命名。
      # 这里用 -DrunIntegration 激活 integration-tests profile（该 profile 才会把
      # skipITs 置为 false；仅用 -P 会被 pom 中 skipITs=true 覆盖），
      # 并在下一步断言“确实有 IT 被执行”，避免 “0 tests, build success” 被当成门禁通过。
      - name: Backend integration tests (Failsafe, real PostgreSQL)
        run: ./mvnw -B -ntp -DrunIntegration -DskipITs=false verify

      - name: Assert integration tests actually ran
        shell: pwsh
        run: |
          # 用真正的 XML 解析而不是 grep（S0/B02）：
          #   - Surefire/Failsafe 报告里的类名是**全限定名**
          #     （name="com.vio.vioaiagent.run.PostgresRunPersistenceIT"），
          #     原实现 grep name="PostgresRunPersistenceIT" 永远匹配不到，
          #     会让 CI 在报告完全合法时误报失败；
          #   - 原实现直接累加 tests 属性，没有扣除 skipped，于是"全部跳过"
          #     也会被统计成"已执行"，门禁形同虚设。
          # GitHub ubuntu-latest runner 预装 PowerShell 7，可直接使用 [xml]。
          $ErrorActionPreference = 'Stop'

          $reportDir = 'target/failsafe-reports'
          if (-not (Test-Path $reportDir)) {
            Write-Host "::error::Failsafe 未生成报告目录 $reportDir：integration profile 未执行任何 IT"
            exit 1
          }

          $files = Get-ChildItem -Path $reportDir -Filter 'TEST-*.xml' -File
          if ($files.Count -eq 0) {
            Write-Host "::error::Failsafe 报告目录为空：integration profile 未真正执行任何 IT"
            exit 1
          }

          $totalTests = 0; $totalRun = 0; $totalSkipped = 0; $totalFailures = 0; $totalErrors = 0
          $classes = @()
          foreach ($file in $files) {
            $suite = ([xml](Get-Content -Raw -Path $file.FullName)).testsuite
            $tests     = [int]$suite.tests
            $skipped   = [int]$suite.skipped
            $failures  = [int]$suite.failures
            $errors    = [int]$suite.errors
            # "实际执行"必须扣除 skipped：被 @EnabledIfEnvironmentVariable 或
            # disabledWithoutDocker 跳过的用例不算执行过。
            $executed  = $tests - $skipped

            $totalTests += $tests; $totalRun += $executed; $totalSkipped += $skipped
            $totalFailures += $failures; $totalErrors += $errors
            $classes += [pscustomobject]@{
              Name = $suite.name; Tests = $tests; Executed = $executed
              Skipped = $skipped; Failures = $failures; Errors = $errors
            }
          }

          $classes | Sort-Object Name | Format-Table -AutoSize | Out-String | Write-Host
          Write-Host "failsafe reports=$($files.Count) tests=$totalTests executed=$totalRun skipped=$totalSkipped failures=$totalFailures errors=$totalErrors"

          if (($totalFailures + $totalErrors) -gt 0) {
            Write-Host "::error::IT 存在失败或错误：failures=$totalFailures errors=$totalErrors"
            exit 1
          }
          if ($totalRun -eq 0) {
            Write-Host "::error::所有 IT 均被跳过，0 个用例实际执行，门禁形同虚设"
            exit 1
          }

          # 数据库 IT 必须**实际执行**，而不是被 disabledWithoutDocker 静默跳过。
          # 按全限定名匹配（B02 的核心修正）。
          $dbClass = $classes | Where-Object { $_.Name -like '*PostgresRunPersistenceIT' }
          if (-not $dbClass) {
            Write-Host "::error::未找到 PostgresRunPersistenceIT 报告，真实数据库验证缺失"
            exit 1
          }
          if ($dbClass.Executed -lt 8) {
            Write-Host "::error::PostgresRunPersistenceIT 实际执行 $($dbClass.Executed) 条，少于预期的 8 条（可能因 Docker 不可用被跳过）"
            exit 1
          }
          if ($dbClass.Skipped -ne 0) {
            Write-Host "::error::PostgresRunPersistenceIT 存在跳过用例"
            exit 1
          }
          Write-Host "PostgresRunPersistenceIT executed=$($dbClass.Executed) skipped=$($dbClass.Skipped)"

          # R03 的不可变报告存储也必须在真实 PostgreSQL 上执行。
          $reportClass = $classes | Where-Object { $_.Name -eq 'com.vio.vioaiagent.rag.promotion.PostgresEvaluationReportIT' }
          if (-not $reportClass -or $reportClass.Executed -lt 6 -or $reportClass.Skipped -ne 0) {
            Write-Host "::error::PostgresEvaluationReportIT 必须实际执行至少 6 条且无跳过用例"
            exit 1
          }
          Write-Host "PostgresEvaluationReportIT executed=$($reportClass.Executed) skipped=$($reportClass.Skipped)"

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          if-no-files-found: warn
          path: |
            target/surefire-reports
            target/failsafe-reports

      - name: v1.1 producer and contract tests
        run: node --test tools/*.test.mjs evaluation/*.test.mjs

      - name: Frontend install
        working-directory: vio-ai-agent-frontend
        run: npm ci

      - name: Frontend security contract
        working-directory: vio-ai-agent-frontend
        run: npm run security:contract

      - name: Frontend version and OpenAPI compatibility
        working-directory: vio-ai-agent-frontend
        run: |
          npm run version:check
          npm run openapi:diff
          # The producer step precedes npm ci; run generated-client transport
          # verification here as well so Blob byte preservation and the new
          # authentication client's types are not skipped on a clean runner.
          node --test ../tools/evaluation-report-openapi.test.mjs ../tools/auth-session-openapi.test.mjs

      - name: Frontend lint
        working-directory: vio-ai-agent-frontend
        run: npm run lint

      - name: Frontend typecheck
        working-directory: vio-ai-agent-frontend
        run: npm run typecheck

      - name: Frontend Run contract tests
        working-directory: vio-ai-agent-frontend
        run: npm run test:contract

      - name: Install Playwright Chromium
        working-directory: vio-ai-agent-frontend
        run: npx --no-install playwright install --with-deps chromium

      - name: Frontend local fixture E2E
        working-directory: vio-ai-agent-frontend
        run: npm run test:e2e -- --base-url http://127.0.0.1:4317

      - name: Frontend build
        working-directory: vio-ai-agent-frontend
        run: npm run build

      - name: Upload frontend E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-evidence
          if-no-files-found: warn
          path: |
            artifacts/v1.1/test/n5-frontend-e2e-report.json
            artifacts/v1.1/test/n5-frontend-e2e-report.html
            vio-ai-agent-frontend/test-results

      - name: Evaluation and contract gate
        run: |
          node tools/validate-evaluation-v1.1.mjs --manifest evaluation/v1.1/manifest.json --dictionary evaluation/v1.1/metric-dictionary.json --report artifacts/v1.1/eval/validation.json
          node tools/v1.1-quality-gate.mjs --mode=ci --manifest evaluation/v1.1/manifest.json --dictionary evaluation/v1.1/metric-dictionary.json --report artifacts/v1.1/eval/ci-report.json

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Build backend image
        run: docker build --pull -t vio-ai-agent:ci-${{ github.sha }} .

      - name: Build frontend image
        run: docker build --pull -t vio-ai-agent-frontend:ci-${{ github.sha }} ./vio-ai-agent-frontend

      - name: Validate Compose (base and monitoring profiles)
        run: |
          docker compose config --quiet
          docker compose --profile monitoring config --quiet

      - name: Compose smoke
        run: |
          docker compose up -d --build
          trap 'docker compose down -v' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8123/api/actuator/health/readiness >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose ps
              docker compose logs --no-color --tail=200 vio-ai-agent
              exit 1
            fi
            sleep 5
          done
          curl --fail --silent http://localhost:8123/api/health >/dev/null
          curl --fail --silent http://localhost:8123/api/ready >/dev/null
          curl --fail --silent http://127.0.0.1/ >/dev/null

          # 业务级 smoke：验证同源代理确实注入 API Key，且 Run 创建/取消/事件
          # 契约可用。取消是显式终止，不依赖外部模型返回，避免 CI 产生副作用。
          RUN_PAYLOAD=$(jq -nc --arg conversationId "ci-smoke-${GITHUB_RUN_ID}" \
            '{prompt:"CI smoke",conversationId:$conversationId,gameReleaseId:"scarlet-violet",battleFormat:"casual-singles",language:"zh-CN",timeoutSeconds:30}')
          RUN_ID=$(curl --fail --silent -X POST http://127.0.0.1/api/chat/runs \
            -H 'Content-Type: application/json' \
            --data "$RUN_PAYLOAD" \
            | jq -er '.runId')
          test -n "$RUN_ID"
          curl --fail --silent -X POST "http://127.0.0.1/api/chat/runs/$RUN_ID/cancel" \
            -H 'Content-Type: application/json' \
            --data '{"reason":"ci_smoke"}' >/dev/null
          curl --fail --silent "http://127.0.0.1/api/chat/runs/$RUN_ID/events?afterEventId=0" \
            | jq -e '.events | type == "array"' >/dev/null
