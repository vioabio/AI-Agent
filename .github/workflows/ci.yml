name: Offline checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql-queue:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: synthetic-ci-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: hr_upgrade_test_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psynthetic-ci-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      UPGRADE_MYSQL_TEST_URL: mysql+pymysql://root:synthetic-ci-only@127.0.0.1:3306/hr_upgrade_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m eval.mysql_queue_acceptance --execute
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: disposable-mysql-queue-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mysql/*/report.json
          retention-days: 7
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install backend and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run offline tests (temporary SQLite, mocked providers)
        run: python -m pytest
      - name: Assemble and verify synthetic acceptance evidence (loopback SDK only)
        id: acceptance
        run: python -m scripts.run_upgrade_acceptance --include-sdk --verify
      - name: Verify queued collection, durable tools and HR projection together
        id: remaining_acceptance
        run: python -m eval.remaining_acceptance
      - name: Preserve remaining integration report
        if: ${{ !cancelled() && steps.remaining_acceptance.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: remaining-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/remaining/*/report.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve synthetic acceptance reports
        if: ${{ !cancelled() && steps.acceptance.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/acceptance/*/manifest.json
            artifacts/acceptance/*/*/report.json
          if-no-files-found: error
          retention-days: 7
      - name: Compile Python sources
        run: python -m compileall -q src apps scripts tests eval
      - name: Check whitespace
        run: git diff --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/hr-review
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/hr-review/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run check:bundle
        id: bundle_budget
      - name: Preserve frontend build budget report
        if: ${{ !cancelled() && steps.bundle_budget.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-budget-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/frontend/build-*/report.json
          if-no-files-found: error
          retention-days: 7
