name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # 仅用于 Compose 冒烟；不是真实凭据，也不会写入镜像或日志。
      DB_PASSWORD: ci-only-db-password
      VIO_API_KEY: ci-only-vio-token
      VIO_CORS_ALLOWED_ORIGINS: http://localhost:3000
      AI_DASHSCOPE_API_KEY: ci-only-dashscope-key
      SEARCH_API_KEY: ci-only-search-key
      VIO_FEEDBACK_OPERATOR_ID: ci-operator
      VIO_FEEDBACK_OPERATOR_ROLE: operator
      VIO_FEEDBACK_ENABLED: "true"
      VIO_MEMORY_ENABLED: "false"
      GRAFANA_ADMIN_PASSWORD: ci-only-grafana-password
      VIO_AGENT_V1_ENABLED: "false"
      VIO_RAG_PGVECTOR_ENABLED: "false"
      VIO_MCP_ENABLED: "false"
      MCP_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vio-ai-agent-frontend/package-lock.json

      - name: Backend compile
        run: ./mvnw -B -ntp -DskipTests compile

      - name: Backend tests
        run: ./mvnw -B -ntp test

      - name: v1.1 producer and contract tests
        run: node --test tools/*.test.mjs evaluation/*.test.mjs

      - name: Frontend install
        working-directory: vio-ai-agent-frontend
        run: npm ci

      - name: Frontend security contract
        working-directory: vio-ai-agent-frontend
        run: npm run security:contract

      - name: Frontend version and OpenAPI compatibility
        working-directory: vio-ai-agent-frontend
        run: |
          npm run version:check
          npm run openapi:diff

      - name: Frontend lint
        working-directory: vio-ai-agent-frontend
        run: npm run lint

      - name: Frontend typecheck
        working-directory: vio-ai-agent-frontend
        run: npm run typecheck

      - name: Frontend Run contract tests
        working-directory: vio-ai-agent-frontend
        run: npm run test:contract

      - name: Install Playwright Chromium
        working-directory: vio-ai-agent-frontend
        run: npx --no-install playwright install --with-deps chromium

      - name: Frontend local fixture E2E
        working-directory: vio-ai-agent-frontend
        run: npm run test:e2e -- --base-url http://127.0.0.1:4317

      - name: Frontend build
        working-directory: vio-ai-agent-frontend
        run: npm run build

      - name: Upload frontend E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-evidence
          if-no-files-found: warn
          path: |
            artifacts/v1.1/test/n5-frontend-e2e-report.json
            artifacts/v1.1/test/n5-frontend-e2e-report.html
            vio-ai-agent-frontend/test-results

      - name: Evaluation and contract gate
        run: |
          node tools/validate-evaluation-v1.1.mjs --manifest evaluation/v1.1/manifest.json --dictionary evaluation/v1.1/metric-dictionary.json --report artifacts/v1.1/eval/validation.json
          node tools/v1.1-quality-gate.mjs --mode=ci --manifest evaluation/v1.1/manifest.json --dictionary evaluation/v1.1/metric-dictionary.json --report artifacts/v1.1/eval/ci-report.json

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Build backend image
        run: docker build --pull -t vio-ai-agent:ci-${{ github.sha }} .

      - name: Build frontend image
        run: docker build --pull -t vio-ai-agent-frontend:ci-${{ github.sha }} ./vio-ai-agent-frontend

      - name: Validate Compose (base and monitoring profiles)
        run: |
          docker compose config --quiet
          docker compose --profile monitoring config --quiet

      - name: Compose smoke
        run: |
          docker compose up -d --build
          trap 'docker compose down -v' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8123/api/actuator/health/readiness >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose ps
              docker compose logs --no-color --tail=200 vio-ai-agent
              exit 1
            fi
            sleep 5
          done
          curl --fail --silent http://localhost:8123/api/health >/dev/null
          curl --fail --silent http://localhost:8123/api/ready >/dev/null
          curl --fail --silent http://127.0.0.1/ >/dev/null

          # 业务级 smoke：验证同源代理确实注入 API Key，且 Run 创建/取消/事件
          # 契约可用。取消是显式终止，不依赖外部模型返回，避免 CI 产生副作用。
          RUN_PAYLOAD=$(jq -nc --arg conversationId "ci-smoke-${GITHUB_RUN_ID}" \
            '{prompt:"CI smoke",conversationId:$conversationId,gameReleaseId:"scarlet-violet",battleFormat:"casual-singles",language:"zh-CN",timeoutSeconds:30}')
          RUN_ID=$(curl --fail --silent -X POST http://127.0.0.1/api/chat/runs \
            -H 'Content-Type: application/json' \
            --data "$RUN_PAYLOAD" \
            | jq -er '.runId')
          test -n "$RUN_ID"
          curl --fail --silent -X POST "http://127.0.0.1/api/chat/runs/$RUN_ID/cancel" \
            -H 'Content-Type: application/json' \
            --data '{"reason":"ci_smoke"}' >/dev/null
          curl --fail --silent "http://127.0.0.1/api/chat/runs/$RUN_ID/events?afterEventId=0" \
            | jq -e '.events | type == "array"' >/dev/null
