global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: 'vio-ai-agent'
    metrics_path: '/api/actuator/prometheus'
    static_configs:
      - targets: ['vio-ai-agent:8123']
